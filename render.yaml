services:
  - type: web
    name: mensagens-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm --dir backend prisma:generate && pnpm --dir backend build
    startCommand: pnpm --dir backend start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URLS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false

